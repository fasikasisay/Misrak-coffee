<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Coffee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">
    <div class="glass">

        <h1>Complete Your Order</h1>

        <h3 id="coffeeName"></h3>

        <input type="number" id="quantity" class="form-control my-3" value="1" min="1">

        <h4>Payment Method</h4>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" value="Telebirr" checked>
            <label>Telebirr</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" value="CBE Birr">
            <label>CBE Birr</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" value="Cash">
            <label>Cash on Delivery</label>
        </div>

        <button class="btn btn-success w-100 mt-3" onclick="placeOrder()">Place Order</button>

    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const coffee = params.get("coffee");

document.getElementById("coffeeName").innerText = "Ordering: " + coffee;
function placeOrder(){
    const quantity = document.getElementById("quantity").value;
    const payment = document.querySelector('input[name="payment"]:checked').value;

    // Simulate balance check
    const balance = Math.floor(Math.random() * 100); // fake balance
    const price = quantity * 50; // assume 50 birr per coffee

    if(balance < price){
        window.location.href = `fail.html?coffee=${coffee}&payment=${payment}&balance=${balance}&price=${price}`;
    } else {
        // Redirect based on payment method
        if(payment === "Telebirr"){
            window.location.href = `telebirr.html?coffee=${coffee}&quantity=${quantity}`;
        } else if(payment === "CBE Birr"){
            window.location.href = `cbe.html?coffee=${coffee}&quantity=${quantity}`;
        } else {
            window.location.href = `success.html?coffee=${coffee}&quantity=${quantity}&payment=${payment}`;
        }
    }
}
</script>

</body>
</html>
